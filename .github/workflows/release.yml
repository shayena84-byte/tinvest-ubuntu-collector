name: Test and publish v1.4.0 archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "ai_sandbox_agent.py"
      - "install_ai_agent.sh"
      - "tests/test_ai_agent.py"
      - "sandbox_autotrader.py"
      - "collector.py"
      - "tests/test_autotrader.py"
      - "tests/test_collector.py"
      - "market_recorder.py"
      - "tests/test_market_recorder.py"
      - "install_market_recorder.sh"
      - "MARKET_RECORDER.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline tests
        run: |
          python3 -m py_compile collector.py sandbox.py sandbox_autotrader.py ai_sandbox_agent.py market_recorder.py
          bash -n install_market_recorder.sh
          python3 -m unittest discover -s tests -v

      - name: Build installer ZIP
        run: |
          mkdir -p /tmp/tinvest_ubuntu_collector
          cp collector.py sandbox.py sandbox_autotrader.py ai_sandbox_agent.py market_recorder.py install.sh install_autotrader.sh install_ai_agent.sh install_market_recorder.sh README.md MARKET_RECORDER.md /tmp/tinvest_ubuntu_collector/
          cp -r tests /tmp/tinvest_ubuntu_collector/
          cd /tmp
          zip -q -r "$GITHUB_WORKSPACE/tinvest_ubuntu_collector.zip" tinvest_ubuntu_collector

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 tinvest_ubuntu_collector.zip --clobber
          else
            gh release create v1.4.0 tinvest_ubuntu_collector.zip --title "T-Invest Ubuntu Collector v1.4.0" --notes "Add secure 5-minute Sandbox market historian: quotes, 10-level order books, SQLite, systemd."
          fi
