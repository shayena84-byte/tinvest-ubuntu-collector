name: Test and publish v1.7.0 archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "ai_sandbox_agent.py"
      - "install_ai_agent.sh"
      - "tests/test_ai_agent.py"
      - "sandbox_autotrader.py"
      - "collector.py"
      - "tests/test_autotrader.py"
      - "tests/test_collector.py"
      - "market_recorder.py"
      - "tests/test_market_recorder.py"
      - "install_market_recorder.sh"
      - "MARKET_RECORDER.md"
      - "market_dashboard.py"
      - "dashboard.html"
      - "dashboard.js"
      - "install_market_quality.sh"
      - "MARKET_QUALITY_DASHBOARD.md"
      - "tests/test_market_dashboard.py"
      - "ollama_sandbox_agent.py"
      - "tests/test_ollama_sandbox_agent.py"
      - "install_v1_6.sh"
      - "V1_6_AUTONOMOUS_SANDBOX.md"
      - "openai_quality_trader.py"
      - "install_openai_backend.sh"
      - "tests/test_openai_quality_trader.py"
      - "V1_7_OPENAI_SANDBOX.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline tests
        run: |
          python3 -m py_compile collector.py sandbox.py sandbox_autotrader.py ai_sandbox_agent.py market_recorder.py market_dashboard.py ollama_sandbox_agent.py openai_quality_trader.py
          bash -n install_market_recorder.sh install_market_quality.sh install_v1_6.sh install_openai_backend.sh
          node --check dashboard.js
          python3 -m unittest discover -s tests -v

      - name: Build installer ZIP
        run: |
          mkdir -p /tmp/tinvest_ubuntu_collector
          cp collector.py sandbox.py sandbox_autotrader.py ai_sandbox_agent.py ollama_sandbox_agent.py openai_quality_trader.py market_recorder.py market_dashboard.py dashboard.html dashboard.js install.sh install_autotrader.sh install_ai_agent.sh install_market_recorder.sh install_market_quality.sh install_v1_6.sh install_openai_backend.sh README.md MARKET_RECORDER.md MARKET_QUALITY_DASHBOARD.md V1_6_AUTONOMOUS_SANDBOX.md V1_7_OPENAI_SANDBOX.md /tmp/tinvest_ubuntu_collector/
          cp -r tests /tmp/tinvest_ubuntu_collector/
          cd /tmp
          zip -q -r "$GITHUB_WORKSPACE/tinvest_ubuntu_collector.zip" tinvest_ubuntu_collector

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.7.0 >/dev/null 2>&1; then
            gh release upload v1.7.0 tinvest_ubuntu_collector.zip --clobber
          else
            gh release create v1.7.0 tinvest_ubuntu_collector.zip --title "T-Invest Ubuntu Collector v1.7.0" --notes "OpenAI Responses backend with existing API key; strict SQLite quality gates; Sandbox-only virtual orders. Ollama not required."
          fi
