name: Publish immutable versioned archive
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, e.g. v1.11.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUESTED_TAG: ${{ inputs.tag || '' }}
      SOURCE_REF: ${{ github.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Resolve immutable version tag
        id: version
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from version import VERSION
          tag='v'+VERSION
          requested=os.environ['REQUESTED_TAG']
          ref=os.environ['SOURCE_REF']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag), 'Invalid version'
          if requested: assert requested==tag, 'Version/tag mismatch'
          if ref.startswith('refs/tags/'): assert ref=='refs/tags/'+tag, 'Tag mismatch'
          existing=subprocess.run(['gh','release','view',tag],capture_output=True).returncode==0
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('tag='+tag+'\npublish='+('false' if existing else 'true')+'\n')
          if existing: print('Existing release is preserved; no assets will be replaced.')
          PY
      - name: Tests, syntax and installation
        if: steps.version.outputs.publish == 'true'
        run: |
          python3 -m compileall -q .
          for task_script in *.sh; do bash -n "$task_script"; done
          node --check dashboard.js
          node tests/test_dashboard_dom.js
          python3 -m unittest discover -s tests -q
      - name: Create or verify immutable tag
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          else
            test "$SOURCE_REF" = refs/heads/main
            git tag "$RELEASE_TAG" HEAD
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git checkout --detach "$RELEASE_TAG"
      - name: Build checksummed package from tagged source
        if: steps.version.outputs.publish == 'true'
        run: python3 build_release.py --output .build/tinvest_ubuntu_collector.zip
      - name: Publish new release without modifying existing assets
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release will not be overwritten." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" .build/tinvest_ubuntu_collector.zip .build/tinvest_ubuntu_collector.zip.sha256 --verify-tag --title "T-Invest Ubuntu Collector $RELEASE_TAG" --notes-file V1_11_OPERATIONS.md
