name: Test and publish v1.3.1 archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "ai_sandbox_agent.py"
      - "install_ai_agent.sh"
      - "tests/test_ai_agent.py"
      - "sandbox_autotrader.py"
      - "collector.py"
      - "tests/test_autotrader.py"
      - "tests/test_collector.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline tests
        run: |
          python3 -m py_compile collector.py sandbox.py sandbox_autotrader.py ai_sandbox_agent.py
          python3 -m unittest discover -s tests -v

      - name: Build installer ZIP
        run: |
          mkdir -p /tmp/tinvest_ubuntu_collector
          cp collector.py sandbox.py sandbox_autotrader.py ai_sandbox_agent.py install.sh install_autotrader.sh install_ai_agent.sh README.md /tmp/tinvest_ubuntu_collector/
          cp -r tests /tmp/tinvest_ubuntu_collector/
          cd /tmp
          zip -q -r "$GITHUB_WORKSPACE/tinvest_ubuntu_collector.zip" tinvest_ubuntu_collector

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.1 >/dev/null 2>&1; then
            gh release upload v1.3.1 tinvest_ubuntu_collector.zip --clobber
          else
            gh release create v1.3.1 tinvest_ubuntu_collector.zip --title "T-Invest Ubuntu Collector v1.3.1" --notes "AI Sandbox agent GetCandles hotfix; validated offline, no production trading."
          fi
