name: Offline regression and installation tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline tests
        run: |
          python3 -m compileall -q .
          for task_script in *.sh; do bash -n "$task_script"; done
          node --check dashboard.js
          python3 -m unittest discover -s tests -q
